[workspace]
resolver = "3"
members = [
    "crates/lanhub-ot",
    "crates/lanhub-protocol",
    "crates/lanhub-core",
    "crates/lanhub-cli",
]
# The Tauri app joins the workspace in A7.
exclude = ["app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "fs"] }
sha1 = "0.11"
getrandom = "0.4"
socket2 = "0.6"
ts-rs = "12"
toml = "1.2"
# ring, not aws-lc-rs: the provider for TLS and certificate generation (see the A6 trail row).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sha2 = "0.11"
