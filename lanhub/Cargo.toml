[workspace]
resolver = "3"
members = [
    "crates/lanhub-ot",
    "crates/lanhub-protocol",
    "crates/lanhub-core",
    "crates/lanhub-cli",
]
# The Tauri app joins the workspace in A7.
exclude = ["app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = "1"
serde_json = "1"
